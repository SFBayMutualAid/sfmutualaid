<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Admin | SF Bay Area Mutual Aid</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='15' fill='%23ff5a1f' stroke='%23111' stroke-width='2'/%3E%3Ctext x='16' y='22' text-anchor='middle' font-family='Impact,sans-serif' font-size='15' fill='%23111'%3EMA%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Work+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.css">
<style>
  :root { --paper: #f2ede4; --ink: #111; --orange: #ff5a1f; --white: #fff; --line: #2a2a2a; }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--paper); color: var(--ink); font: 15px/1.5 "Work Sans", system-ui, sans-serif; }
  .display { font-family: Anton, Impact, sans-serif; text-transform: uppercase; font-weight: 400; letter-spacing: .02em; margin: 0; line-height: 1; }
  .hidden { display: none !important; }
  button, select, input { font: inherit; }
  .btn { padding: 9px 16px; border: 3px solid var(--ink); background: var(--white); color: var(--ink); font-weight: 700; text-transform: uppercase; letter-spacing: .05em; font-size: 13px; cursor: pointer; text-decoration: none; display: inline-block; }
  .btn:hover { background: var(--paper); }
  .btn.primary { background: var(--orange); box-shadow: 4px 4px 0 var(--ink); }
  .btn.primary:hover { background: var(--ink); color: var(--paper); }
  .btn:disabled { opacity: .5; cursor: not-allowed; }

  /* Login */
  .login { min-height: 100%; display: grid; place-items: center; padding: 24px; }
  .login form { width: 100%; max-width: 420px; background: var(--orange); border: 3px solid var(--ink); box-shadow: 10px 10px 0 var(--ink); padding: 32px; }
  .login .display { font-size: 44px; margin-bottom: 8px; }
  .login p { margin: 0 0 18px; font-weight: 500; }
  .login input { width: 100%; padding: 14px; border: 3px solid var(--ink); background: var(--paper); margin-bottom: 12px; font-weight: 500; }
  .login .btn { width: 100%; padding: 14px; background: var(--ink); color: var(--paper); font-family: Anton, sans-serif; font-size: 22px; font-weight: 400; }
  .error { color: var(--ink); background: var(--white); border: 2px solid var(--ink); padding: 8px 12px; margin: 12px 0 0; font-weight: 700; }

  /* Editor */
  .app { height: 100%; display: flex; flex-direction: column; }
  .bar { background: var(--ink); color: var(--paper); display: flex; align-items: center; gap: 16px; padding: 12px 20px; }
  .bar .logo { font-family: Anton, sans-serif; text-transform: uppercase; font-size: 20px; letter-spacing: .03em; color: var(--paper); text-decoration: none; }
  .bar .logo b { color: var(--orange); font-weight: 400; }
  .bar .tag { background: var(--orange); color: var(--ink); font-weight: 700; font-size: 12px; text-transform: uppercase; letter-spacing: .08em; padding: 3px 8px; }
  .bar .spacer { flex: 1; }
  .bar .btn { background: transparent; color: var(--paper); border-color: var(--paper); }
  .bar .btn:hover { background: var(--paper); color: var(--ink); }

  .tools { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; padding: 12px 20px; border-bottom: 3px solid var(--ink); background: var(--white); }
  .tools label { font-weight: 700; font-size: 13px; text-transform: uppercase; letter-spacing: .05em; }
  .tools select { padding: 8px 10px; border: 3px solid var(--ink); background: var(--paper); font-weight: 600; min-width: 220px; }
  .tools input[type=text] { padding: 8px 10px; border: 3px solid var(--ink); background: var(--paper); min-width: 240px; flex: 1; max-width: 420px; }
  .tools .grow { flex: 1; }
  .status { font-weight: 600; font-size: 14px; }
  .status.warn { color: #b03a00; }
  .status.ok { color: #0a6b2f; }

  .panes { flex: 1; min-height: 0; display: grid; grid-template-columns: 1fr 1fr; }
  .pane { min-height: 0; display: flex; flex-direction: column; }
  .pane + .pane { border-left: 3px solid var(--ink); }
  .pane-head { display: flex; align-items: center; gap: 8px; padding: 8px 14px; background: var(--paper); border-bottom: 2px solid var(--ink); font-weight: 700; font-size: 12px; text-transform: uppercase; letter-spacing: .06em; }
  .pane-head .grow { flex: 1; }
  .seg button { padding: 4px 10px; border: 2px solid var(--ink); background: var(--white); font-weight: 700; font-size: 12px; text-transform: uppercase; cursor: pointer; }
  .seg button + button { border-left: 0; }
  .seg button[aria-pressed=true] { background: var(--ink); color: var(--paper); }
  .editor { flex: 1; min-height: 0; position: relative; }
  .editor textarea { width: 100%; height: 100%; border: 0; padding: 12px; font: 13px/1.5 ui-monospace, Consolas, monospace; resize: none; }
  .editor .CodeMirror { position: absolute; inset: 0; height: auto; font: 13px/1.5 ui-monospace, Consolas, monospace; }
  .preview { flex: 1; min-height: 0; background: #d9d3c8; overflow: auto; display: flex; justify-content: center; }
  .preview iframe { width: 100%; height: 100%; border: 0; background: var(--white); }
  .preview.phone { padding: 16px 0; }
  .preview.phone iframe { width: 375px; height: 100%; min-height: 640px; border: 3px solid var(--ink); flex: none; }
  .empty { display: grid; place-items: center; height: 100%; color: #666; font-weight: 600; }

  @media (max-width: 900px) {
    .panes { grid-template-columns: 1fr; grid-template-rows: 1fr 1fr; }
    .pane + .pane { border-left: 0; border-top: 3px solid var(--ink); }
  }
</style>
</head>
<body>

<div class="login hidden" id="login">
  <form id="login-form">
    <h1 class="display">Admin</h1>
    <p>SF Bay Area Mutual Aid site editor.</p>
    <input type="password" id="password" autocomplete="current-password" placeholder="Password" aria-label="Password" required>
    <button class="btn" type="submit">Log in</button>
    <p class="error hidden" id="login-error" role="alert"></p>
  </form>
</div>

<div class="app hidden" id="app">
  <div class="bar">
    <a class="logo" href="/" target="_blank" rel="noopener">SF Bay <b>Mutual Aid</b></a>
    <span class="tag">Admin</span>
    <span class="spacer"></span>
    <button class="btn" type="button" id="logout">Log out</button>
  </div>

  <div class="tools">
    <label for="page">Page</label>
    <select id="page" aria-label="Page to edit"></select>
    <a class="btn" id="view-live" href="/" target="_blank" rel="noopener">View live</a>
    <button class="btn" type="button" id="revert" disabled>Undo all changes</button>
    <span class="grow"></span>
    <input type="text" id="message" placeholder="What did you change? (optional)" aria-label="Change description" maxlength="200">
    <button class="btn primary" type="button" id="save" disabled>Save &amp; publish</button>
  </div>
  <div class="tools" style="padding-top:8px;padding-bottom:8px;border-bottom-width:2px">
    <span class="status" id="status" role="status">Loading pages…</span>
  </div>

  <div class="panes">
    <section class="pane">
      <div class="pane-head"><span>HTML</span><span class="grow"></span><span id="dirty-flag"></span></div>
      <div class="editor"><textarea id="code" spellcheck="false" aria-label="Page HTML"></textarea></div>
    </section>
    <section class="pane">
      <div class="pane-head">
        <span>Preview</span><span class="grow"></span>
        <span class="seg" role="group" aria-label="Preview width">
          <button type="button" id="w-desktop" aria-pressed="true">Desktop</button><button type="button" id="w-phone" aria-pressed="false">Phone</button>
        </span>
      </div>
      <div class="preview" id="preview-wrap">
        <!-- sandbox without allow-same-origin: previewed scripts can't reach the admin session -->
        <iframe id="preview" title="Page preview" sandbox="allow-scripts allow-popups"></iframe>
      </div>
    </section>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/xml/xml.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/javascript/javascript.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/css/css.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/htmlmixed/htmlmixed.min.js"></script>
<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  var state = { path: null, sha: null, original: "", pages: [] };
  var editor = null;
  var previewTimer = null;

  function api(url, options) {
    options = options || {};
    options.headers = Object.assign({ "X-Admin-Request": "1" }, options.body ? { "Content-Type": "application/json" } : {}, options.headers || {});
    options.credentials = "same-origin";
    return fetch(url, options).then(function (r) {
      return r.json().catch(function () { return {}; }).then(function (data) {
        if (r.status === 401 && url.indexOf("/login") === -1) { showLogin(); }
        if (!r.ok) throw Object.assign(new Error(data.error || "Request failed (" + r.status + ")"), { status: r.status });
        return data;
      });
    });
  }

  function setStatus(text, kind) {
    var s = $("status");
    s.textContent = text;
    s.className = "status" + (kind ? " " + kind : "");
  }

  function getCode() { return editor ? editor.getValue() : $("code").value; }
  function setCode(v) {
    if (editor) { editor.setValue(v); editor.clearHistory(); editor.scrollTo(0, 0); }
    else $("code").value = v;
  }
  function isDirty() { return state.path !== null && getCode() !== state.original; }

  function updateDirty() {
    var dirty = isDirty();
    $("save").disabled = !dirty;
    $("revert").disabled = !dirty;
    $("dirty-flag").textContent = dirty ? "Unsaved changes" : "";
  }

  // Render the HTML in a sandboxed frame; <base> makes /css, /js and /images load from this site.
  function renderPreview() {
    var html = getCode();
    var base = '<base href="' + location.origin + '/" target="_blank">';
    html = /<head[^>]*>/i.test(html) ? html.replace(/<head[^>]*>/i, function (m) { return m + base; }) : base + html;
    $("preview").srcdoc = html;
  }
  function schedulePreview() {
    clearTimeout(previewTimer);
    previewTimer = setTimeout(renderPreview, 300);
  }

  function onChange() { updateDirty(); schedulePreview(); }

  function initEditor() {
    if (editor || !window.CodeMirror) return;
    editor = CodeMirror.fromTextArea($("code"), {
      mode: "htmlmixed", lineNumbers: true, lineWrapping: true, indentUnit: 2, tabSize: 2,
    });
    editor.on("change", onChange);
  }

  function loadPages() {
    setStatus("Loading pages…");
    return api("/api/admin/pages").then(function (data) {
      state.pages = data.pages;
      var sel = $("page");
      sel.innerHTML = "";
      data.pages.forEach(function (p) {
        var o = document.createElement("option");
        o.value = p.path;
        o.textContent = p.url === "/" ? "Home  (/)" : p.url;
        sel.appendChild(o);
      });
      var wanted = decodeURIComponent((location.hash || "").slice(1));
      var start = data.pages.some(function (p) { return p.path === wanted; }) ? wanted : data.pages[0].path;
      sel.value = start;
      return openPage(start);
    }).catch(function (e) { setStatus(e.message, "warn"); });
  }

  function openPage(path) {
    setStatus("Opening " + path + "…");
    $("save").disabled = true;
    return api("/api/admin/pages?path=" + encodeURIComponent(path)).then(function (page) {
      state.path = page.path; state.sha = page.sha; state.original = page.html;
      setCode(page.html);
      $("page").value = page.path;
      var p = state.pages.filter(function (x) { return x.path === page.path; })[0];
      $("view-live").href = p ? p.url : "/";
      history.replaceState(null, "", "#" + encodeURIComponent(page.path));
      updateDirty();
      renderPreview();
      setStatus("Editing " + (p ? p.url : page.path) + ". Changes show in the preview as you type; nothing goes live until you save.");
    }).catch(function (e) { setStatus(e.message, "warn"); });
  }

  function save() {
    if (!isDirty()) return;
    var p = state.pages.filter(function (x) { return x.path === state.path; })[0];
    if (!confirm("Publish your changes to " + (p ? p.url : state.path) + " on the live site?")) return;
    $("save").disabled = true;
    setStatus("Saving…");
    var html = getCode();
    api("/api/admin/pages", {
      method: "PUT",
      body: JSON.stringify({ path: state.path, sha: state.sha, html: html, message: $("message").value }),
    }).then(function (r) {
      state.sha = r.sha; state.original = html;
      $("message").value = "";
      updateDirty();
      setStatus("Saved. The live site updates in about a minute.", "ok");
    }).catch(function (e) {
      updateDirty();
      setStatus(e.message, "warn");
    });
  }

  function showLogin() {
    $("app").classList.add("hidden");
    $("login").classList.remove("hidden");
    $("password").focus();
  }
  function showApp() {
    $("login").classList.add("hidden");
    $("app").classList.remove("hidden");
    initEditor();
    if (editor) editor.refresh();
    loadPages();
  }

  $("login-form").addEventListener("submit", function (e) {
    e.preventDefault();
    var err = $("login-error");
    err.classList.add("hidden");
    var btn = this.querySelector("button");
    btn.disabled = true; btn.textContent = "Checking…";
    api("/api/admin/login", { method: "POST", body: JSON.stringify({ password: $("password").value }) })
      .then(function () { $("password").value = ""; showApp(); })
      .catch(function (e2) { err.textContent = e2.message; err.classList.remove("hidden"); })
      .then(function () { btn.disabled = false; btn.textContent = "Log in"; });
  });

  $("logout").addEventListener("click", function () {
    if (isDirty() && !confirm("You have unsaved changes. Log out anyway?")) return;
    api("/api/admin/login", { method: "DELETE" }).then(function () { state.path = null; showLogin(); });
  });

  $("page").addEventListener("change", function () {
    var next = this.value;
    if (isDirty() && !confirm("You have unsaved changes on this page. Discard them?")) { this.value = state.path; return; }
    openPage(next);
  });

  $("revert").addEventListener("click", function () {
    if (!confirm("Throw away your changes to this page?")) return;
    setCode(state.original);
    updateDirty();
    renderPreview();
  });

  $("save").addEventListener("click", save);
  $("code").addEventListener("input", onChange);
  document.addEventListener("keydown", function (e) {
    if ((e.ctrlKey || e.metaKey) && e.key === "s") { e.preventDefault(); save(); }
  });

  function setWidth(phone) {
    $("preview-wrap").classList.toggle("phone", phone);
    $("w-phone").setAttribute("aria-pressed", String(phone));
    $("w-desktop").setAttribute("aria-pressed", String(!phone));
  }
  $("w-desktop").addEventListener("click", function () { setWidth(false); });
  $("w-phone").addEventListener("click", function () { setWidth(true); });

  window.addEventListener("beforeunload", function (e) {
    if (isDirty()) { e.preventDefault(); e.returnValue = ""; }
  });

  api("/api/admin/login").then(function (r) { r.loggedIn ? showApp() : showLogin(); }).catch(showLogin);
})();
</script>
</body>
</html>
